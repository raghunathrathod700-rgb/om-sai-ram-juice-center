spring.application.name=om-sai-ram-juice-center
server.port=${PORT:8080}

# ---- MySQL (database "osrjc" is created automatically on first start) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:osrjc}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# update = tables are created / extended automatically. For production consider "validate" + migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- uploads (product photos) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# ---- security ----
# REQUIRED: at least 32 characters, keep it secret (example: openssl rand -hex 32)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:72}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- first admin account (created only when no admin exists yet) ----
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Shop Admin}
app.admin.mobile=${ADMIN_MOBILE:0000000000}

# ---- Razorpay (leave empty to disable online payment) ----
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ---- shop rules ----
shop.delivery-fee=${DELIVERY_FEE:0}
shop.radius-meters=${DELIVERY_RADIUS_METERS:500}
# Put the shop's GPS position to make the server enforce the 500 m rule (customers then must share location):
#shop.latitude=21.0000
#shop.longitude=76.0000
